name: Swift
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Test detection behavior
        run: swift test
      - name: Build app bundle
        run: bash scripts/build-app.sh
